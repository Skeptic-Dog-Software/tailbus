# A second repository, in another language, to show the framework needs no
# change for one: this is tailbus's own review, in Rust.
version: 1
human_gate: ends
max_rounds: 3
review_scope: whole-pr
not_findings: .acr/not-findings.md
always_escalate:
  - a change to the wire format between buses
tiers:
  - id: docs
    match: {paths: ["**/*.md"]}
    fan_out: 1
  - id: routine
    match: {description: "a change inside one module with no new behavior"}
    fan_out: 1
  - id: core
    match: {description: "the bus, the wire format, storage or process handling"}
    fan_out: 2
    required: [lock-discipline]
lenses:
  - id: correctness
    criteria: "Wrong results, unhandled errors, lost messages"
    triggers: {paths: ["src/**/*.rs"]}
  - id: lock-discipline
    criteria: "A MutexGuard held across a second lock; a lock held over blocking work"
    triggers: {content: ["\\.db\\(\\)", "lock\\("]}
    severity: {Medium: blocks}
  - id: process-safety
    criteria: "Leaked processes, signals, a kill that can reach the wrong process"
    triggers: {content: ["kill", "Command::new"]}
  - id: wire-compatibility
    criteria: "An older bus or stored row misread, or dropped without saying so"
    triggers: {paths: ["src/proto.rs", "src/store.rs"]}
  - id: docs-accuracy
    criteria: "Docs that no longer match what the code does"
    triggers: {paths: ["**/*.md"]}
integrations:
  labels:
    not_ready: not-ready
    ready: ready
  comment: summary
