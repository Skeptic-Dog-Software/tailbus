# An example for a repository in Go. Every lens, path and pattern here is the
# repository's own choice: the framework knows none of them.
version: 1
human_gate: per-round
max_rounds: 3
review_scope: bottom-of-stack
not_findings: not-findings.md
always_escalate:
  - a change to a public HTTP endpoint
tiers:
  - id: docs
    match: {paths: ["**/*.md", "docs/**"]}
    fan_out: 1
  - id: small
    match: {description: "renames, messages, dependency bumps"}
    fan_out: 1
  - id: core
    match: {description: "handlers, storage, concurrency, or more than one package"}
    fan_out: 3
lenses:
  - id: correctness
    criteria: "Wrong results, ignored errors, broken invariants"
    triggers: {paths: ["**/*.go"]}
  - id: goroutine-safety
    criteria: "Data races, leaked goroutines, channels that block forever"
    triggers: {content: ["go func", "sync\\.", "chan "]}
  - id: storage
    criteria: "Migrations that lose data, queries whose meaning changes"
    triggers: {paths: ["internal/store/**", "migrations/**"]}
  - id: http-compatibility
    criteria: "A handler change that breaks existing clients"
    triggers: {description: "an HTTP handler's request or response changes"}
  - id: docs-accuracy
    criteria: "Docs that no longer match the code"
    triggers: {paths: ["**/*.md"], description: "new public docs"}
integrations:
  labels:
    not_ready: not-ready
    ready: ready
    waiting: "wait:{lens}"
    confirmed: "confirmed:{lens}"
