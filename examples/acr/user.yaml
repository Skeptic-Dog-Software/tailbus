# Your ACR config, at ~/.config/tailbus/acr.yaml. Only this file says how
# models are reached: which bridge agent, which of its models, with which
# tools. A repository chooses among these names. tailbus assumes no provider,
# model or binding of its own, so everything here is an example: set your own.
# ACR runs on one machine: every agent here must be on the machine with the
# code, where its reviewers read the repository itself, read-only.
version: 1
allowed_bindings:
  small:
    agent: models@my-mac
    model: example/small-model
    tools: [read, grep, glob]
    timeout: 14400   # 4 hours: a cap no review should ever reach
  medium:
    agent: models@my-mac
    model: example/medium-model
    effort: high
    tools: [read, grep, glob]
    timeout: 14400
  large:
    agent: models@my-mac
    model: example/large-model
    effort: medium
    tools: [read, grep, glob]
    timeout: 14400
    writes: true    # the Orchestrator may apply fixes, in the repository
defaults:
  human_gate: exception
  # Every role needs a binding, here or in the repository's config.
  bindings:
    sizer: small
    reviewer: medium
    orchestrator: large
    judge: large
