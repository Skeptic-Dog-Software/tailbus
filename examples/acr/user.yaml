# Your ACR config, at ~/.config/tailbus/acr.yaml. Only this file can say how
# models are reached. A repository chooses among these names. The agents, models
# and prices here are examples: set your own.
version: 1
allowed_bindings:
  glm-flash:
    agent: omp@server
    model: example/glm-flash
    tools: [read, grep, glob]
    timeout: 300
    input_per_mtok: 0.1
    output_per_mtok: 0.4
  glm-flash-high:
    agent: omp@server
    model: example/glm-flash
    effort: high
    tools: [read, grep, glob]
    timeout: 900
    input_per_mtok: 0.1
    output_per_mtok: 0.4
  opus-medium:
    agent: acr-opus@laptop
    model: opus
    effort: medium
    tools: [read, grep, glob]
    timeout: 900
    workdir: /Users/you/Work/the-repo
    input_per_mtok: 5
    output_per_mtok: 25
defaults:
  human_gate: exception
