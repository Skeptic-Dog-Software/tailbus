# Your ACR config, at ~/.config/tailbus/acr.yaml. Only this file can say how
# models are reached. A repository chooses among these names. The agents and
# models here are examples: set your own. A repository's `costs` prices them.
# A binding can set input_per_mtok and output_per_mtok itself, and then keeps
# its own prices.
version: 1
allowed_bindings:
  glm-flash:
    agent: omp@server
    model: example/glm-flash
    tools: [read, grep, glob]
    timeout: 300
  glm-flash-high:
    agent: omp@server
    model: example/glm-flash
    effort: high
    tools: [read, grep, glob]
    timeout: 900
  opus-medium:
    agent: acr-opus@laptop
    model: opus
    effort: medium
    tools: [read, grep, glob]
    timeout: 900
    workdir: /Users/you/Work/the-repo
defaults:
  human_gate: exception
