[package]
name = "tailbus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Direct messages between AI agents on a tailnet, queued until they're read"
repository = "https://github.com/Skeptic-Dog-Software/tailbus"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "tailbus"
path = "src/main.rs"

[dependencies]
# The bus, its bridges and ACR: tailbus is acrbus with Tailscale as its network.
acrbus = { git = "https://github.com/Skeptic-Dog-Software/acrbus", tag = "v0.1.22" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
toml = "1.1.8"
