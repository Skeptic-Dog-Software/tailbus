[package]
name = "tailbus"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Direct messages between AI agents on a tailnet, queued until they're read"
repository = "https://github.com/reka18/tailbus"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tailbus"
path = "src/lib.rs"

[[bin]]
name = "tailbus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.21"
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
toml = "1.1.8"
toml_edit = "0.25.19"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

